name: Build GridCraft Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download & Bundle Official GridCraft Web Assets
        run: |
          mkdir -p app/src/main/assets/gridcraft
          curl -sSL -o gridcraft-web.zip https://github.com/storytold/gridcraft/releases/download/v0.11.1/gridcraft-web-0.11.1.zip
          unzip -q gridcraft-web.zip -d /tmp/gc_extract
          cp -r /tmp/gc_extract/gridcraft-web-0.11.1/* app/src/main/assets/gridcraft/
          rm -rf /tmp/gc_extract gridcraft-web.zip
          python3 tools/patch_index.py app/src/main/assets/gridcraft/index.html

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair -v -keystore app/release.jks -alias gridcraft \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass gridcraft -keypass gridcraft \
            -dname "CN=GridCraft, OU=Android, O=Storytold, L=City, S=State, C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Organize Release Artifacts
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/app-release.apk release_apk/GridCraft-v0.11.1-android.apk
          ls -lh release_apk/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GridCraft-v0.11.1-Android-APK
          path: release_apk/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GridCraft Android ${{ github.ref_name }}
          files: release_apk/*.apk
          draft: false
          prerelease: false
          body: |
            ## GridCraft for Android (Offline APK)

            Clean-room open-source Microsoft Excel-compatible spreadsheet running offline on Android & Xiaomi Pad 7.

            ### Features
            - **Microsoft Excel Desktop UI:** Full ribbon tabs, formula bar (`fx`), Name Box, sheet tabs, autofill handle, dark mode.
            - **XLSX & Spreadsheet Compatibility:** Open and save `.xlsx`, `.csv`, `.tsv`, with legacy `.xls` and `.ods` import.
            - **Powerful Formula Engine:** 500+ standard worksheet functions, dynamic arrays, `XLOOKUP`, `INDEX/MATCH`, `LET`, `LAMBDA`, `FILTER`, `UNIQUE`.
            - **Data Analysis:** Pivot tables, conditional formatting, 17 chart types, sparklines, and auto-filters.
            - **Optimized for Tablets:** Hardware-accelerated 120Hz/144Hz WebGL2/WebGPU on Xiaomi Pad 7 with full physical keyboard & shortcut support (`Ctrl+C`, `Ctrl+V`, `Ctrl+Z`, `Ctrl+S`, `F2`).
            - **100% Offline:** Assets, WebAssembly engine, and calculation processing run locally on the device with zero network traffic.
            - **Seamless Storage:** Built-in Android storage integration for opening workbooks and exporting directly to `Downloads/GridCraft/`.
